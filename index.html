<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezilla - Real Estate</title>
    
    <!-- Favicon -->
    <link rel="icon" href="/assests/images/favicon_io/favicon.ico" type="image/x-icon">

    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="Base HTML Structure">
    <meta property="og:description" content="A simple base HTML structure with favicon and OpenGraph metadata.">
    <meta property="og:image" content="/path/to/image.jpg">
    <meta property="og:url" content="https://example.com">
    <meta name="twitter:card" content="summary_large_image">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
 
</head>
<body>
    <header>
        <div class="top-bar">
            <div>
                <img src="/assests/images/icon _pin alt_.png" alt="Location">
                <span>Rezilla, 18 Grattan St, Brooklyn</span>
            </div>
            <div>
                <img src="/assests/images/icon _phone_.png" alt="Phone">
                <span>+1 206-214-2298</span>
                <img src="/assests/images/icon _mail_.png" alt="Email">
                <span>support@rezilla.com</span>
            </div>
        </div>
        <div class="container">
            <nav>
                <div class="menu">
                    <a href="#home">Home</a>
                    <a href="#about">About</a>
                    <a href="#listings">Listings</a>
                    <a href="#services">Services</a>
                    <a href="#blogs">Blogs</a>
                    <div class="cta mobile">
                        <a href="#login">
                            <img src="/assests/images/user.svg" alt="Login/Register" style="height: 20px; margin-right: 0.5rem;">
                            Login/Register
                        </a>
                        <button>
                            <img src="/assests/images/icon-house.png" alt="Add Listing" style="height: 20px; margin-right: 0.5rem;">
                            Add Listing
                        </button>
                    </div>
                </div>
                <div class="logo">
                    <img src="/assests/images/Rezilla-icon.png" alt="Rezilla Logo">
                    <span style="font-weight: 700;">Rezilla</span>
                </div>
                <div class="cta desktop">
                    <a href="#login">
                        <img src="/assests/images/user.svg" alt="Login/Register" style="height: 20px; margin-right: 0.5rem;">
                        Login/Register
                    </a>
                    <button>
                        <img src="/assests/images/icon-house.png" alt="Add Listing" style="height: 20px; margin-right: 0.5rem;">
                        Add Listing
                    </button>
                </div>
<!-- 
                <div class="menu-icon" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div> -->
                <div class="menu-icon" onclick="toggleMenu()">
                    <span class="line"></span>
                    <span class="line"></span>
                    <span class="line"></span>
                    <svg class="cross-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 6L18 18" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
            </nav>
        </div>
    </header>


    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            const crossIcon = document.querySelector('.cross-icon');
            const lines = document.querySelectorAll('.menu-icon .line');
    
            menu.classList.toggle('active');
            crossIcon.classList.toggle('visible');
    
            lines.forEach(line => {
                line.classList.toggle('hidden');
            });
        }
    </script>
    
</body>
</html>
